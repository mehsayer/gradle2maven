[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gradle2maven"
version = "1.0.0"
description = "Create a local Maven repository with every dependency of a Gradle build (Groovy or Kotlin DSL)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["gradle", "maven", "offline", "dependencies", "repository", "air-gapped"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
gradle2maven = "gradle2maven:main"

[tool.setuptools]
py-modules = ["gradle2maven"]
